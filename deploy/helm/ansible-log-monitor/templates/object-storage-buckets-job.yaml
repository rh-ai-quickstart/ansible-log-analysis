{{- if .Values.awsCompatibleStorageBuckets.create }}
{{- $fullname := include "alm.objectStorage.fullname" . }}
{{- $secret := include "alm.objectStorage.secretName" . }}
{{- $apiPort := include "alm.objectStorage.apiPort" . }}
{{- $uiPort := include "alm.objectStorage.uiPort" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-object-storage-buckets
  labels:
    app.kubernetes.io/name: object-storage-buckets
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: bucket-bootstrap
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  # Deliberately NOT a post-install hook: Helm runs `--wait` before hooks, and both
  # Loki and the RAG init job block until their buckets exist. As a regular Job this
  # runs alongside the rest of the release.
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: object-storage-buckets
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: bucket-bootstrap
    spec:
      restartPolicy: Never
      containers:
        - name: create-buckets
          image: {{ .Values.global.jobImages.python | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /tmp
            - name: S3_HOST
              value: {{ $fullname | quote }}
            - name: S3_PORT
              value: {{ $apiPort | quote }}
            - name: S3_UI_PORT
              value: {{ $uiPort | quote }}
            - name: S3_REGION
              value: {{ (index .Values "aws-compatible-storage" "s3" "region") | default "us-east-1" | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: AWS_SECRET_ACCESS_KEY
            - name: BUCKETS
              value: {{ join "," .Values.awsCompatibleStorageBuckets.names | quote }}
          command:
            - sh
            - -c
            - |
              set -e
              # `pip install --user` fails on ubi9/python-311; install into the venv with HOME=/tmp.
              pip install --no-cache-dir -q boto3
              python3 <<'PY'
              import os, sys, time
              import boto3
              from botocore.client import Config
              from botocore.exceptions import ClientError, EndpointConnectionError

              host = os.environ["S3_HOST"]
              port = os.environ["S3_PORT"]
              endpoint = f"http://{host}:{port}"
              buckets = [b.strip() for b in os.environ["BUCKETS"].split(",") if b.strip()]

              s3 = boto3.client(
                  "s3",
                  endpoint_url=endpoint,
                  region_name=os.environ.get("S3_REGION", "us-east-1"),
                  # Ceph RGW requires path-style addressing.
                  config=Config(signature_version="s3v4", s3={"addressing_style": "path"}),
              )

              # S4's S3 API can accept connections slightly before it is usable, so gate on
              # a real list_buckets call rather than a TCP probe.
              deadline = time.time() + 600
              while True:
                  try:
                      s3.list_buckets()
                      print(f"✓ S3 API ready at {endpoint}", flush=True)
                      break
                  except (EndpointConnectionError, ClientError, OSError) as e:
                      if time.time() > deadline:
                          print(f"✗ Timed out waiting for {endpoint}: {e}", file=sys.stderr)
                          sys.exit(1)
                      print(f"  waiting for {endpoint} ({type(e).__name__})...", flush=True)
                      time.sleep(5)

              for name in buckets:
                  try:
                      s3.head_bucket(Bucket=name)
                      print(f"  bucket '{name}' already exists", flush=True)
                      continue
                  except ClientError:
                      pass
                  try:
                      s3.create_bucket(Bucket=name)
                      print(f"✓ created bucket '{name}'", flush=True)
                  except ClientError as e:
                      code = e.response.get("Error", {}).get("Code", "")
                      if code in ("BucketAlreadyOwnedByYou", "BucketAlreadyExists"):
                          print(f"  bucket '{name}' already exists", flush=True)
                      else:
                          print(f"✗ failed to create '{name}': {e}", file=sys.stderr)
                          sys.exit(1)

              # Smoke test: prove the credentials can actually read and write objects.
              probe = buckets[0]
              s3.put_object(Bucket=probe, Key=".bootstrap-check", Body=b"ok")
              body = s3.get_object(Bucket=probe, Key=".bootstrap-check")["Body"].read()
              assert body == b"ok", f"round-trip mismatch: {body!r}"
              s3.delete_object(Bucket=probe, Key=".bootstrap-check")
              print(f"✓ read/write smoke test passed on '{probe}'", flush=True)
              print("✓ object storage bootstrap complete", flush=True)
              PY
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
{{- end }}
